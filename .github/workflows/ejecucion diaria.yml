name: Monitoreo Caudales Pirque

on:
  schedule:
    # Se ejecuta todos los días a las 12:00 PM hora de Chile continental estándar
    # Nota: Si estás en horario de verano (UTC-3), cambiar a '0 15 * * *'
    - cron: '0 16 * * *' 
  workflow_dispatch: # Permite ejecutarlo manualmente desde GitHub

jobs:
  build:
    runs-on: ubuntu-latest
    
    # Esto soluciona automáticamente el error 403 de permisos
    permissions:
      contents: write

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar librerías
        run: pip install requests pandas

      # ASEGÚRATE de que este nombre sea igual al de tu archivo Python
      - name: Ejecutar script
        run: python "Caudales Pirque Github.py"

      - name: Guardar datos en el CSV
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add caudales_pirque.csv
          git diff --quiet && git diff --staged --quiet || (git commit -m "Actualizacion automatica de caudales canal Pirque" && git push)
